modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"
issueTrackerURL = "https://github.com/lul-prog/Yuletides-FireWorks/issues"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
displayTest = "IGNORE_SERVER_VERSION"
description = '''
${mod_description}

Shells are composed from real pyrotechnic chemistry: metal salts burn at characteristic
temperatures and wavelengths (strontium 606nm crimson, barium 524nm green, copper halide 455nm
azure, sodium 589nm amber, magnesium/ aluminium white-hot). The burst geometry is generated per
explosion from a seeded Fibonacci scheme, so a "ring" really is a ring and a "willow" really
hangs and droops. Everything renders through the vanilla particle shader program so Iris/Oculus
shaderpacks apply their own bloom, fog and tonemapping to it — no bypassed custom GLSL.
'''

[[dependencies.${mod_id}]]
    modId = "forge"
    type = "required"
    versionRange = "${forge_version_range}"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.${mod_id}]]
    modId = "minecraft"
    type = "required"
    versionRange = "${minecraft_version_range}"
    ordering = "NONE"
    side = "BOTH"
