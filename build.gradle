plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = '1.0.0'
group = 'com.fireworkshaders'

base {
    archivesName = 'fireworkshaders'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'debug'
            mods {
                fireworkshaders {
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'debug'
            mods {
                fireworkshaders {
                    source sourceSets.main
                }
            }
        }
    }
}

repositories {
    maven {
        url = 'https://maven.minecraftforge.net/'
    }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.2.0'

    // No additional runtime libraries are needed for this foundation. The workstation
    // uses Forge menus/networking, and the fireworks use this mod's GLSL renderer;
    // avoiding a Lodestone/GeckoLib hard dependency keeps the client setup lean.
}

tasks.named('processResources', ProcessResources).configure {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    var replaceProperties = [
            minecraft_version      : '1.20.1',
            minecraft_version_range: '[1.20.1,1.21)',
            forge_version          : '47.2.0',
            forge_version_range    : '[47,)',
            loader_version_range   : '[47,)',
            mod_id                 : 'fireworkshaders',
            mod_name               : 'Firework Shaders',
            mod_license            : 'All Rights Reserved',
            mod_version            : project.version,
            mod_authors            : 'Simon Alzate',
            mod_description        : 'Advanced shader-driven fireworks with a modular pyrotechnic workstation and custom rocket designs.',
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml']) {
        expand replaceProperties + [project: project]
    }
}
